{% extends "base.html" %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/criar_exercicio.css') }}">
{% endblock %}

{% block content %}
<section>
    <h1>Criar exercício</h1>

    <form action="{{url_for('criar_exercicio')}}" method="POST">

        <div class="campo">
            <label for="nome">Nome do exercício</label>
            <input type="text" id="nome" name="nome" maxlength="100" value="{{ nome or '' }}"
                placeholder="Ex: Supino reto" required>
        </div>

        <div class="campo">

            <label for="grupo_muscular">Grupo Muscular</label>
            <input type="text" id="grupo_muscular" name="grupo_muscular" maxlength="50"
                value="{{ grupo_muscular or '' }}" placeholder="Ex: Peito" required>
        </div>

        <div class="campo">
            <label for="descricao">Descrição <span class="opcional">(opcional) </span></label>
            <textarea name="descricao" id="descricao" rows="4" placeholder="Como executar, dicas, observações...">
                {{ descricao or '' }}
            </textarea>
        </div>

        <div class="acoes">
            <a class="cancelar" href="{{url_for('exercicios')}} ">Cancelar</a>
            <button type="submit">Salvar exercício</button>
        </div>
    </form>
</section>
{% endblock %}
