<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrar | FitLevel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

  <main class="login">

    <a class="brand" href="#">
      <span class="brand-icon">★</span>
      <span class="brand-name">FitLevel</span>
    </a>

    <section class="card login-card">
      <h1>Bem-vindo de volta!</h1>
      <p class="subtitulo">Entre para continuar sua sequência de hoje.</p>

      <div class="aviso" id="aviso" role="alert" hidden>
        {{ erro }}
      </div>

      <form id="form-login" method="POST" action="{{url_for('entrar')}}" novalidate>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email"
                 autocomplete="email" placeholder="voce@exemplo.com"
                 aria-describedby="erro-email" required>
          <p class="erro" id="erro-email"></p>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <div class="campo-senha">
            <input type="password" id="senha" name="senha"
                   autocomplete="current-password" placeholder="Sua senha"
                   aria-describedby="erro-senha" required>
            <button type="button" class="ver-senha" id="ver-senha"
                    aria-label="Mostrar senha" aria-pressed="false">👁️</button>
          </div>
          <p class="erro" id="erro-senha"></p>
        </div>

        <div class="linha-opcoes">
          <label class="check">
            <input type="checkbox" id="lembrar" name="lembrar">
            <span>Manter conectado</span>
          </label>
          <a class="link" href="#">Esqueci a senha</a>
        </div>

        <button type="submit" class="btn" id="btn-entrar">
          <span class="btn-texto">Entrar</span>
        </button>
      </form>
    </section>

    <p class="rodape">
      Ainda não tem conta? <a class="link" href="#">Criar conta grátis</a>
    </p>

  </main>

  <script src="/static/script/login.js"></script>
</body>
</html>
