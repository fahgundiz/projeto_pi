<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | QuestApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="login-page">

  <main class="login">
    <div class="login-brand">
      <span class="brand-icon" aria-hidden="true">★</span>
      <span class="brand-name">QuestApp</span>
    </div>

    <form class="card login-card" id="loginForm" method="POST" action="{{url_for('entrar')}}" novalidate>
      <h1>Entrar</h1>
      <p class="login-sub">Continue sua jornada de onde parou.</p>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="voce@email.com" required>
        <span class="field-error" id="emailError" role="alert"></span>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres" required>
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar senha">Mostrar</button>
        </div>
        <span class="field-error" id="passwordError" role="alert"></span>
      </div>

      <div class="login-row">
        <label class="check">
          <input type="checkbox" id="remember"> Lembrar de mim
        </label>
        <a href="#" class="link">Esqueci a senha</a>
      </div>

      <p class="form-error" id="formError" role="alert"></p>

      <button type="submit" class="btn btn-full" id="submitBtn">Entrar</button>

      <p class="login-foot">Novo por aqui? <a href="#" class="link">Criar conta</a></p>
    </form>
  </main>
  
</body>
</html>
