<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %} Fitlevel {% endblock %}</title>
  {% block styles %} {% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css">
</head>
<body>

  <header class="navbar">

    <a href="#" class="logo">
      <span class="logo-icon">★</span>
      <span class="logo-name">FitLevel</span>
    </a>

    <nav class="nav" aria-label="nav principal">
      <button class="nav-btn ativo" data-view="hoje" aria-current="pagina_ativa">
        <span>🏠</span> Hoje
      </button>

      <button class="nav-btn" data-view="habitos">
        <span>✅</span> Hábitos
      </button>

      <button class="nav-btn" data-view="progresso">
        <span>📈</span> Progresso
      </button>


    </nav>

    <div class="status">

      <div class="level">
        <span class="level-label">Nível 1</span>
        <div class="xp-bar">

          <div class="xp-fill"></div>
        </div>
      </div>

      <div class="coins">🔥 3 dias</div>
    </div>

  </header>

  <main class="content">
    {% block content %} {% endblock %}
  </main>

  <script src="/static/script/base.js"></script>
</body>
</html>
