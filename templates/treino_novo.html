{% extends "base.html" %}
{% block styles %}
    <link rel="stylesheet" href="{{url_for('static', filename='css/treino_novo.css')}}">
{% endblock %}
{% block content %}
    <section class="content-section">
        <a class="voltar" href="{{url_for('treinos')}}">← Voltar aos treinos</a>
        <h1>Novo treino</h1>
        {% if erro %}
            <div class="alerta erro"> {{erro}} </div>
        {% endif %}
        <form class="form-treino" action="{{url_for('treino_novo')}}" method="POST">
            <div class="campo">
                <label for="nome">Nome do treino</label>
                <input type="text" id="nome" name="nome" value="{{ nome or '' }}" placeholder="Ex: Treino A - Peito" required>
            </div>

            <div class="campo">
                <label for="descricao">Descrição <span class="opcional">(opcional)</span></label>
                <textarea name="descricao" id="descricao" value="{{ descricao or '' }}"></textarea>
            </div>

            <h2>Exercícios</h2>
            
            <div id="linhas"></div>
            <button type="button" class="btn-adicionar" id="btn-adicionar">+ Adicionar exercício</button>

            <div class="acoes">
                <a class="cancelar" href="{{url_for('treinos')}}">Cancelar</a>
                <button type="submit" class="btn-salvar">Salvar treino</button>
            </div>
            
        </form>
    </section>

    <template id="modelo-linha">
        <div class="linha-exercicio">
            <div class="campo campo-exercicio">
                <label>Exercício</label>
                <select name="exercicio_id" required>
                    <option value="">Selecione...</option>
                    {% for ex in catalogo %}
                        <option value="{{ex['id']}}"> {{ex['nome']}} {{ex['grupo_muscular']}} </option>
                    {% endfor %}
                </select>
            </div>
            <div class="campo">
                <label>Seŕies</label>
                <input type="number" name="series" min="1" value="3" required>
            </div>
            <div class="campo">
                <label>Repetições</label>
                <input type="number" name="repeticoes" min="1" value="10" required>
            </div>
            <div class="campo">
                <label>Carga (Kg)</label>
                <input type="number" name="carga_kg" min="0" step="0.5">
            </div>
            <div class="campo">
                <label>Descanso (s)</label>
                <input type="number" name="descanso_seg" min="0" value="60">
            </div>

            <button type="button" class="btn-remover" title="Remover">✕</button>

        </div>
    </template>
{% endblock %}
{% block script %}
    <script src="/static/script/treino_novo.js"></script>
{% endblock %}
