{% extends "base.html" %}

{% block content %}
    <section class="content-section">
        <a class="voltar" href="{{url_for('treinos')}}">← Voltar aos treinos</a>
        <h1>Novo treino</h1>
        {% if erro %}
            <div class="alerta erro"> {{erro}} </div>
        {% endif %}
        <form action="{{url_for('treino_novo')}}" method="POST">
            <div class="campo">
                <label for="nome">Nome do treino</label>
                <input type="text" id="nome" name="nome" value="{{ nome or '' }}" required>
            </div>

            <div class="campo">
                <label for="descricao">Descrição</label>
                <textarea name="descricao" id="descricao" value="{{ descricao or '' }}"></textarea>
            </div>

            <h2>Exercícios</h2>
            <select name="exercicio_id" required>
                <option value="">Selecione...</option>
                {% for ex in catalogo %}
                    <option value="{{ex['id']}}"> {{ex['nome']}} </option>
                {% endfor %}
            </select>
            <input type="number" name="series" value="3" min="1" required>
            <input type="number" name="repeticoes" value="10" min="1" required>
            <input type="number" name="carga_kg" min="0" step="0.5">
            <input type="number" name="descanso_seg" value="60" min="0">
            
            <div class="acoes">
                <a class="cancelar" href="{{url_for('treinos')}}">Cancelar</a>
                <button type="submit">Salvar treino</button>
            </div>
            
        </form>
    </section>
{% endblock %}
